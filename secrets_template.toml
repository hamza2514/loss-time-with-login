# ------------------------------------------------------------------
# Copy the content below into: Streamlit Cloud -> your app -> Settings
# -> Secrets, then edit the passwords for real use before sharing the
# app with anyone. Do NOT commit this file (with real values) to a
# public GitHub repo.
#
# "units" controls which unit(s) an account can see/enter data for.
# One unit = locked to it. Two units = a unit switcher appears in the
# sidebar (only one unit's data shown/entered at a time).
# ------------------------------------------------------------------

# Your Neon connection string (see the Neon dashboard -> Connect).
# Must include ?sslmode=require at the end. Same database serves both units.
DATABASE_URL = "postgresql://<user>:<password>@<your-project>.neon.tech/<dbname>?sslmode=require"

[cookie]
name = "loss_time_auth_cookie"
key = "change_this_to_a_random_secret_string_123"
expiry_days = 7

