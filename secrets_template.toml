# ------------------------------------------------------------------
# Copy the content below into: Streamlit Cloud -> your app -> Settings
# -> Secrets, then edit the usernames/passwords/roles/DATABASE_URL for real use.
# Do NOT commit this file (with real values) to a public GitHub repo.
# ------------------------------------------------------------------

# Your Neon connection string (see the Neon dashboard -> Connect).
# Must include ?sslmode=require at the end.
DATABASE_URL = "postgresql://<user>:<password>@<your-project>.neon.tech/<dbname>?sslmode=require"

